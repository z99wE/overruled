version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns: ["react", "react-dom"]
      tooling:
        patterns: ["vite", "vitest", "typescript", "eslint", "typescript-eslint"]
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"