        "@context": "https://schema.org",

            "@type": "Question",
            "name": "How does Overrool analyze legal documents without privacy leaks?",
            "acceptedAnswer": {
              "@type": "Answer",

          },
          {
            "@type": "Question",
            "name": "Can Overrool invent or hallucinate citations?",
            "acceptedAnswer": {
              "@type": "Answer",

    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
