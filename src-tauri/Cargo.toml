[package]
name = "overrool"
version = "0.1.0"
edition = "2021"
description = "Overrool — adversarial legal strategy courtroom RPG"
license = "MIT"
authors = ["Overrool Contributors"]
rust-version = "1.77.0"

[lib]
name = "overrool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "overrool"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
